<script>
// PWA：注册 service worker + 提示「可安装到桌面」。
// 只在 https 或 localhost 下可用 —— 手机用 http://192.168.x.x 打开时，
// 浏览器按规范不会注册 SW，所以下面会明确告诉用户「装不了，直接用浏览器」，
// 而不是让「添加到主屏幕」按钮点了没反应。
(function () {
  var canPWA = location.protocol === "https:" || location.hostname === "localhost"
            || location.hostname === "127.0.0.1";
  if (!canPWA) {
    window.__kbPWA = { supported: false,
      reason: "手机通过局域网 IP 打开时浏览器不注册 Service Worker（需 HTTPS）。仍可正常使用，或手动「添加到主屏幕」。" };
    return;
  }
  if (!("serviceWorker" in navigator)) {
    window.__kbPWA = { supported: false, reason: "这个浏览器不支持 Service Worker。" };
    return;
  }
  var prompt = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    prompt = e;
    window.__kbPWA = Object.assign(window.__kbPWA || {}, { canInstall: true, prompt: e });
    document.dispatchEvent(new CustomEvent("kb-installable"));
  });
  navigator.serviceWorker.register("/sw.js").then(function (reg) {
    window.__kbPWA = Object.assign(window.__kbPWA || {}, { supported: true, reg: reg });
  }).catch(function (err) {
    window.__kbPWA = { supported: false, reason: "Service Worker 注册失败：" + err.message };
  });
  window.__kbInstall = function () {
    if (!prompt) return Promise.resolve(false);
    prompt.prompt();
    return prompt.userChoice.then(function (c) { return c.outcome === "accepted"; });
  };
})();
</script>
